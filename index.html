<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e4572e">
<title>Mouthful</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen landscape stage. Index card on the left, control rail on the right. Single committed look; backdrop shifts tangerine (family) → berry (18+). */
:root{
  --stage:#e4572e;        /* tangerine felt backdrop, family mode */
  --stage-deep:#b8401d;
  --card:#fbf6ea;         /* index card paper */
  --rule:#d9e3ef;         /* ruled line blue */
  --margin:#e9a2a2;       /* card margin line */
  --ink:#1d2340;          /* navy ink */
  --ink-soft:#5a5f7a;
  --gold:#ffd23f;         /* highlight / scores */
  --good:#1f9d6b;
  --pass:#8b8fa8;
  --on-stage:#fff7ec;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
:root.adult{ --stage:#6b1d45; --stage-deep:#4a1230; --gold:#ffc94a; }
:root.mixed{ --stage:#2d4f8f; --stage-deep:#1f3a6d; }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--stage);color:var(--on-stage);font-family:var(--body);font-size:16px;overflow:hidden;transition:background .5s ease;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:radial-gradient(circle at 1px 1px, #000 1px, transparent 1.4px);background-size:6px 6px}
.app{height:100%;box-sizing:border-box;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));position:relative;z-index:1}
.screen{height:100%;display:flex;gap:16px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Setup ---------- */
#setup{flex-direction:row;align-items:stretch}
.brand{flex:1 1 42%;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(40px, min(13vh, 8vw), 104px);line-height:.88;letter-spacing:-.03em;margin:0}
.logo span{display:block;color:var(--gold)}
.tag{font-size:clamp(14px, 2.6vh, 18px);max-width:30ch;line-height:1.35;margin:0;opacity:.92}
.sample{margin-top:6px;background:var(--card);color:var(--ink);border-radius:6px;padding:10px 14px;transform:rotate(-2deg);max-width:300px;box-shadow:0 8px 0 var(--stage-deep)}
.sample b{font-family:var(--display);font-size:clamp(18px,4vh,26px);display:block;line-height:1.05}
.sample small{color:var(--ink-soft);font-size:13px}
.panel{flex:1 1 58%;min-width:0;background:var(--card);color:var(--ink);border-radius:14px;padding:clamp(12px,2.6vh,22px) clamp(14px,2.4vw,24px);display:flex;flex-direction:column;gap:clamp(8px,1.8vh,14px);overflow:auto;box-shadow:0 10px 0 var(--stage-deep)}
.row{display:flex;flex-direction:column;gap:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:72px;padding:10px 10px;border-radius:10px;background:#efe7d3;color:var(--ink);font-weight:700;font-size:15px;line-height:1.1}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button[aria-pressed="true"] small{color:#c9cce0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.teams input{font:inherit;font-weight:600;font-size:15px;padding:9px 10px;border-radius:10px;border:2px solid #e2d8bf;background:#fff;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.teams-ctl{display:flex;gap:6px;align-items:center}
.mini{padding:6px 12px;border-radius:999px;background:#efe7d3;font-weight:700;font-size:13px;color:var(--ink)}
.go{margin-top:8px;max-width:340px;width:100%;padding:14px;border-radius:12px;background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:800;font-size:clamp(18px,4vh,24px);box-shadow:0 5px 0 var(--stage-deep);transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--stage-deep)}
.deckinfo{font-size:13px;opacity:.85}
.hidden-row[hidden]{display:none}
@media (max-height:500px){.seg button{padding:7px 8px;font-size:14px}.seg button small{display:none}.teams input{padding:6px 8px}.panel{gap:8px}.logo{font-size:clamp(36px,16vh,72px)}.sample{display:none}}

/* ---------- Play ---------- */
#play{flex-direction:row;align-items:stretch}
.cardwrap{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;perspective:1200px}
.card{position:relative;width:100%;height:100%;max-height:100%;background:var(--card);color:var(--ink);border-radius:10px;box-shadow:0 12px 0 var(--stage-deep), 0 20px 40px rgba(0,0,0,.25);
  background-image:linear-gradient(to right, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px),
                   repeating-linear-gradient(to bottom, transparent 0, transparent 37px, var(--rule) 37px, var(--rule) 39px);
  background-position:0 0, 0 52px;display:flex;flex-direction:column;padding:14px 22px 14px 74px;box-sizing:border-box;overflow:hidden}
.card.deal{animation:deal .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes deal{from{transform:translateX(30%) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.badge{padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--card);letter-spacing:.06em}
.badge.adult{background:#a3245f}
.gib{flex:1;display:flex;align-items:center;margin:0;font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;
  font-size:clamp(26px, min(13vh, 7.4vw), 112px)}
.gib.long{font-size:clamp(22px, min(10vh, 5.6vw), 84px)}
.hint{min-height:1.4em;font-size:clamp(14px,3vh,19px);color:var(--ink-soft);font-style:italic;margin:0}
.answer{position:absolute;inset:auto 0 0 0;padding:12px 22px 14px 74px;font-family:var(--display);font-weight:700;font-size:clamp(20px,6vh,40px);line-height:1.05;color:#fff;transform:translateY(100%);transition:transform .25s ease}
.answer.show{transform:none}
.answer.got{background:var(--good)}
.answer.pass{background:var(--ink)}
.answer small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.rail{flex:0 0 clamp(170px, 26vw, 260px);display:flex;flex-direction:column;gap:clamp(6px,1.4vh,10px);min-width:0}
.turnof{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.teamname{font-family:var(--display);font-weight:800;font-size:clamp(18px,4.6vh,28px);line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{display:flex;align-items:baseline;gap:8px}
.secs{font-family:var(--display);font-weight:800;font-size:clamp(30px,10vh,58px);line-height:.9;font-variant-numeric:tabular-nums}
.secs.low{color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform 1s linear}
.tally{font-size:14px;font-weight:600;opacity:.9}
.btns{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:clamp(10px,3vh,16px) 8px;border-radius:12px;font-weight:700;font-size:clamp(15px,3.4vh,19px);background:rgba(255,255,255,.16);color:var(--on-stage);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.big{grid-column:1/-1;background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:800;font-size:clamp(18px,5vh,26px)}
.btn[disabled]{opacity:.4;pointer-events:none}
.topbtns{display:flex;gap:6px}
.ghost{padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.2);font-size:13px;font-weight:700}

/* ---------- Between turns / results ---------- */
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:var(--stage);
  padding-block:max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet{width:min(900px,100%);max-height:100%;box-sizing:border-box;display:flex;gap:18px;align-items:stretch}
.sheet .big{flex:1 1 45%;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.sheet h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,10vh,64px);line-height:.95;margin:0;text-wrap:balance}
.sheet p{margin:0;font-size:clamp(14px,3vh,18px);opacity:.92}
.scores{flex:1 1 55%;background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-width:0;box-shadow:0 10px 0 var(--stage-deep)}
.sc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed #e6dcc4;font-weight:700}
.sc:last-of-type{border-bottom:0}
.sc .n{font-family:var(--display);font-size:clamp(20px,5vh,30px);font-variant-numeric:tabular-nums}
.sc.next{color:var(--stage)}
.log{font-size:14px;display:flex;flex-direction:column;gap:3px}
.log div{display:flex;gap:8px}
.log .g{color:var(--good);font-weight:700}
.log .p{color:var(--pass);font-weight:700}

.rotate{display:none}
@media (orientation:portrait) and (max-width:820px){
  .rotate{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:9;background:var(--ink);color:var(--card);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
  #setup,#play{flex-direction:column}
  .brand{flex:0 0 auto}
  .sample{display:none}
  .rail{flex:0 0 auto}
  .btns{margin-top:0}
  .gib{font-size:clamp(26px,9vw,60px)}
  .gib.long{font-size:clamp(22px,7.5vw,48px)}
  .card{padding-left:40px;background-image:linear-gradient(to right, transparent 26px, var(--margin) 26px, var(--margin) 28px, transparent 28px),repeating-linear-gradient(to bottom, transparent 0, transparent 37px, var(--rule) 37px, var(--rule) 39px)}
  .answer{padding-left:40px}
  .sheet{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
</head>
<body>


<div class="app">
  <!-- SETUP -->
  <section class="screen" id="setup">
    <div class="brand">
      <h1 class="logo">Mouth<span>ful</span></h1>
      <p class="tag">Read the nonsense out loud. Keep reading until it turns into a phrase you know.</p>
      <div class="sample" aria-hidden="true"><b>Eye kneader drink</b><small>Say it faster…</small></div>
      <button type="button" class="go" id="start">Deal the cards</button>
      <div class="deckinfo" id="deckinfo"></div>
    </div>
    <div class="panel">
      <div class="row">
        <span class="label" id="lbl-mode">Card deck</span>
        <div class="seg" role="group" aria-labelledby="lbl-mode" id="mode">
          <button type="button" data-v="family">Family<small id="c-family"></small></button>
          <button type="button" data-v="adult">18+<small id="c-adult"></small></button>
          <button type="button" data-v="mixed">Everything<small id="c-mixed"></small></button>
        </div>
      </div>
      <div class="row">
        <span class="label" id="lbl-style">How to play</span>
        <div class="seg" role="group" aria-labelledby="lbl-style" id="style">
          <button type="button" data-v="teams">Team race<small>Timed turns, scores</small></button>
          <button type="button" data-v="free">Free play<small>No clock, just cards</small></button>
        </div>
      </div>
      <div class="row hidden-row" id="teamrow">
        <div class="teams-ctl"><span class="label" style="flex:1">Teams</span>
          <button type="button" class="mini" id="rmteam" aria-label="Remove a team">−</button>
          <button type="button" class="mini" id="addteam" aria-label="Add a team">+</button></div>
        <div class="teams" id="teams"></div>
      </div>
      <div class="row hidden-row" id="timerow">
        <span class="label" id="lbl-time">Turn length · rounds</span>
        <div class="seg" role="group" aria-labelledby="lbl-time" id="secs">
          <button type="button" data-v="45">45s</button>
          <button type="button" data-v="60">60s</button>
          <button type="button" data-v="90">90s</button>
        </div>
        <div class="seg" role="group" aria-label="Rounds" id="rounds">
          <button type="button" data-v="2">2 rounds</button>
          <button type="button" data-v="3">3 rounds</button>
          <button type="button" data-v="5">5 rounds</button>
        </div>
      </div>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="play" hidden>
    <div class="cardwrap">
      <article class="card" id="card" aria-live="polite">
        <div class="cardtop"><span id="cat"></span><span class="badge" id="rate"></span></div>
        <p class="gib" id="gib"></p>
        <p class="hint" id="hint"></p>
        <div class="answer" id="answer"><small id="anslabel"></small><span id="anstext"></span></div>
      </article>
    </div>
    <aside class="rail">
      <div class="topbtns"><button type="button" class="ghost" id="quit">Menu</button><button type="button" class="ghost" id="pause" hidden>Pause</button></div>
      <div id="teamblock">
        <div class="turnof" id="roundlbl"></div>
        <div class="teamname" id="tname"></div>
      </div>
      <div id="clockblock">
        <div class="clock"><span class="secs" id="secsleft">60</span><span>sec</span></div>
        <div class="bar"><i id="barfill"></i></div>
      </div>
      <div class="tally" id="tally"></div>
      <div class="btns" id="btns-team">
        <button type="button" class="btn" id="b-hint">Hint</button>
        <button type="button" class="btn" id="b-pass">Pass</button>
        <button type="button" class="btn big" id="b-got">Got it!</button>
      </div>
      <div class="btns" id="btns-free" hidden>
        <button type="button" class="btn" id="f-hint">Hint</button>
        <button type="button" class="btn" id="f-reveal">Reveal</button>
        <button type="button" class="btn big" id="f-next">Next card</button>
      </div>
    </aside>
  </section>
</div>

<!-- Between turns -->
<div class="overlay" id="between" hidden>
  <div class="sheet">
    <div class="big">
      <p id="bw-kicker"></p>
      <h2 id="bw-title"></h2>
      <p id="bw-sub"></p>
      <button type="button" class="go" id="bw-go" style="margin-top:12px"></button>
      <button type="button" class="ghost" id="bw-menu" style="align-self:flex-start">Back to menu</button>
    </div>
    <div class="scores" id="bw-scores"></div>
  </div>
</div>

<div class="rotate" id="rotate">Turn your device sideways for the best view</div>

<script>
(function(){
const CARDS = JSON.parse(document.getElementById('cards').textContent);
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem('mouthful.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('mouthful.'+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  mode: store.get('mode','family'),
  style: store.get('style','teams'),
  teams: store.get('teams',['Team Red','Team Blue']),
  secs: store.get('secs',60),
  rounds: store.get('rounds',3),
};
let G = null; // live game

// ---------- deck ----------
function poolFor(mode){
  return CARDS.filter(c => mode==='mixed' ? true : mode==='adult' ? c.rating==='18+' : c.rating==='family');
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function makeDeck(mode){
  const seen = new Set(store.get('seen.'+mode, []));
  let pool = poolFor(mode);
  let fresh = pool.filter(c=>!seen.has(c.id));
  if(fresh.length < 8){ store.set('seen.'+mode, []); fresh = pool.slice(); }
  return shuffle(fresh);
}
function markSeen(mode,id){ const s = store.get('seen.'+mode, []); if(!s.includes(id)){ s.push(id); store.set('seen.'+mode, s);} }

// ---------- setup UI ----------
function setPressed(groupId, val){ $(groupId).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===String(val)))); }
function theme(mode){ document.documentElement.classList.toggle('adult', mode==='adult'); document.documentElement.classList.toggle('mixed', mode==='mixed'); }
function renderTeams(){
  const box = $('teams'); box.innerHTML='';
  S.teams.forEach((name,i)=>{
    const inp = document.createElement('input');
    inp.id='team-'+i; inp.value=name; inp.maxLength=18; inp.setAttribute('aria-label','Team '+(i+1)+' name');
    inp.addEventListener('input',()=>{ S.teams[i]=inp.value; store.set('teams',S.teams); });
    box.appendChild(inp);
  });
  $('rmteam').disabled = S.teams.length<=2; $('addteam').disabled = S.teams.length>=4;
}
function renderSetup(){
  setPressed('mode',S.mode); setPressed('style',S.style); setPressed('secs',S.secs); setPressed('rounds',S.rounds);
  theme(S.mode);
  $('c-family').textContent = poolFor('family').length+' cards';
  $('c-adult').textContent = poolFor('adult').length+' cards';
  $('c-mixed').textContent = CARDS.length+' cards';
  const isTeams = S.style==='teams';
  $('teamrow').hidden = !isTeams; $('timerow').hidden = !isTeams;
  const left = makeDeck(S.mode).length;
  $('deckinfo').textContent = left+' unplayed cards in this deck on this device.';
  renderTeams();
}
function bindSeg(id,key,cast){
  $(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S[key]=cast?cast(b.dataset.v):b.dataset.v; store.set(key,S[key]); renderSetup(); });
}
bindSeg('mode','mode'); bindSeg('style','style'); bindSeg('secs','secs',Number); bindSeg('rounds','rounds',Number);
$('addteam').onclick=()=>{ const names=['Team Red','Team Blue','Team Gold','Team Green']; S.teams.push(names[S.teams.length]||('Team '+(S.teams.length+1))); store.set('teams',S.teams); renderTeams(); };
$('rmteam').onclick=()=>{ if(S.teams.length>2){ S.teams.pop(); store.set('teams',S.teams); renderTeams(); } };
$('start').onclick=startGame;

// ---------- game ----------
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function release(){ try{ wake && wake.release(); }catch(e){} wake=null; }

function startGame(){
  const teams = S.teams.map((n,i)=> (n||'').trim() || ('Team '+(i+1)));
  G = { mode:S.mode, style:S.style, deck:makeDeck(S.mode), teams:teams.map(n=>({name:n,score:0})),
        turn:0, round:1, secs:S.secs, rounds:S.rounds, card:null, log:[], left:S.secs, timer:null, busy:false, hint:false, revealed:false };
  $('setup').hidden=true; $('play').hidden=false;
  const team = G.style==='teams';
  $('teamblock').hidden=!team; $('clockblock').hidden=!team; $('btns-team').hidden=!team; $('btns-free').hidden=team; $('pause').hidden=!team;
  keepAwake();
  if(team) showBetween('ready'); else { $('tally').textContent=''; nextCard(); }
}
function drawCard(){
  if(!G.deck.length) G.deck = shuffle(poolFor(G.mode).slice());
  return G.deck.pop();
}
function nextCard(){
  const c = drawCard(); G.card=c; G.hint=false; G.revealed=false; markSeen(G.mode,c.id);
  $('cat').textContent=c.category;
  const r=$('rate'); r.textContent = c.rating==='18+'?'18+':'Family'; r.classList.toggle('adult', c.rating==='18+');
  const g=$('gib'); g.textContent=c.gibberish; g.classList.toggle('long', c.gibberish.length>30);
  $('hint').textContent=''; $('answer').className='answer';
  const card=$('card'); card.classList.remove('deal'); void card.offsetWidth; card.classList.add('deal');
  if(G.style==='free'){ $('f-reveal').disabled=false; $('f-hint').disabled=false; $('tally').textContent=''; }
  else { $('b-hint').disabled=false; }
}
function showAnswer(kind){
  $('anslabel').textContent = kind==='got'?'Got it':kind==='pass'?'Passed':kind==='time'?'Time! The answer was':'The answer';
  $('anstext').textContent = G.card.answer;
  $('answer').className = 'answer show '+(kind==='got'?'got':'pass');
}
function showHint(){ if(!G||!G.card) return; G.hint=true; $('hint').textContent='Hint: '+G.card.hint; }

function teamTally(){ const t=G.teams[G.turn]; const got=G.log.filter(l=>l.got).length; $('tally').textContent = got+' this turn · '+t.score+' total'; }
function startTurn(){
  G.log=[]; G.left=G.secs; G.busy=false;
  $('roundlbl').textContent='Round '+G.round+' of '+G.rounds; $('tname').textContent=G.teams[G.turn].name;
  ['b-got','b-pass','b-hint'].forEach(id=>$(id).disabled=false);
  nextCard(); teamTally(); tick(true);
  clearInterval(G.timer); G.timer=setInterval(()=>tick(),1000);
}
function tick(first){
  if(!first) G.left--;
  $('secsleft').textContent=Math.max(0,G.left); $('secsleft').classList.toggle('low',G.left<=10);
  $('barfill').style.transform='scaleX('+(Math.max(0,G.left)/G.secs)+')';
  if(G.left<=0){ clearInterval(G.timer); endTurn(); }
}
function act(got){
  if(!G||G.busy) return; G.busy=true;
  G.log.push({c:G.card,got}); if(got) G.teams[G.turn].score++;
  teamTally(); showAnswer(got?'got':'pass');
  setTimeout(()=>{ if(!G||G.left<=0) return; G.busy=false; nextCard(); }, got?900:1300);
}
function endTurn(){
  G.busy=true; ['b-got','b-pass','b-hint'].forEach(id=>$(id).disabled=true);
  if(G.card && !G.log.some(l=>l.c===G.card)) { G.log.push({c:G.card,got:false}); showAnswer('time'); }
  setTimeout(()=>showBetween('summary'),1400);
}
function scoresHTML(highlight){
  const max = Math.max(...G.teams.map(t=>t.score));
  return G.teams.map((t,i)=>`<div class="sc ${i===highlight?'next':''}"><span>${esc(t.name)}</span><span class="n">${t.score}</span></div>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function showBetween(kind){
  const ov=$('between'); ov.hidden=false;
  if(kind==='ready'){
    $('bw-kicker').textContent='Round '+G.round+' of '+G.rounds;
    $('bw-title').textContent=G.teams[G.turn].name+', you\'re up';
    $('bw-sub').textContent='Hand the device to '+G.teams[G.turn].name+'. Read each card out loud as a team and shout the phrase when you hear it.';
    $('bw-go').textContent='Start '+G.secs+'s turn';
    $('bw-scores').innerHTML='<div class="label">Scores</div>'+scoresHTML(G.turn);
    $('bw-go').onclick=()=>{ ov.hidden=true; startTurn(); };
    return;
  }
  // summary of the turn just played, then advance
  const t=G.teams[G.turn]; const got=G.log.filter(l=>l.got).length;
  const logHTML = '<div class="label">This turn</div><div class="log">'+G.log.map(l=>`<div><span class="${l.got?'g':'p'}">${l.got?'✓':'–'}</span><span>${esc(l.c.answer)}</span></div>`).join('')+'</div>';
  G.turn++; if(G.turn>=G.teams.length){ G.turn=0; G.round++; }
  const over = G.round>G.rounds;
  if(over){
    const best=Math.max(...G.teams.map(x=>x.score)); const winners=G.teams.filter(x=>x.score===best);
    $('bw-kicker').textContent='Game over';
    $('bw-title').textContent = winners.length>1 ? 'It\'s a tie!' : winners[0].name+' wins!';
    $('bw-sub').textContent = winners.length>1 ? winners.map(w=>w.name).join(' and ')+' share it with '+best+' each.' : best+' phrases cracked.';
    $('bw-go').textContent='Play again';
    $('bw-scores').innerHTML='<div class="label">Final scores</div>'+scoresHTML(-1)+logHTML;
    $('bw-go').onclick=()=>{ ov.hidden=true; startGame(); };
  } else {
    $('bw-kicker').textContent=t.name+' scored';
    $('bw-title').textContent=got+(got===1?' phrase':' phrases');
    $('bw-sub').textContent='Next up: '+G.teams[G.turn].name+' (round '+G.round+' of '+G.rounds+').';
    $('bw-go').textContent=G.teams[G.turn].name+', start';
    $('bw-scores').innerHTML='<div class="label">Scores</div>'+scoresHTML(G.turn)+logHTML;
    $('bw-go').onclick=()=>{ ov.hidden=true; startTurn(); };
  }
}
function toMenu(){ if(G){ clearInterval(G.timer);} G=null; release(); $('between').hidden=true; $('play').hidden=true; $('setup').hidden=false; renderSetup(); }

let paused=false;
$('pause').onclick=()=>{
  if(!G) return;
  if(!paused){ paused=true; clearInterval(G.timer); $('pause').textContent='Resume'; ['b-got','b-pass','b-hint'].forEach(id=>$(id).disabled=true); $('gib').style.filter='blur(14px)'; }
  else { paused=false; $('pause').textContent='Pause'; ['b-got','b-pass','b-hint'].forEach(id=>$(id).disabled=false); $('gib').style.filter=''; G.timer=setInterval(()=>tick(),1000); }
};
$('b-got').onclick=()=>act(true);
$('b-pass').onclick=()=>act(false);
$('b-hint').onclick=()=>{ showHint(); $('b-hint').disabled=true; };
$('f-hint').onclick=()=>{ showHint(); $('f-hint').disabled=true; };
$('f-reveal').onclick=()=>{ showAnswer('reveal'); $('f-reveal').disabled=true; };
$('f-next').onclick=nextCard;
$('quit').onclick=toMenu; $('bw-menu').onclick=toMenu;
document.addEventListener('keydown',e=>{
  if(!G || $('play').hidden || !$('between').hidden || e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(G.style==='teams'){ if(paused) return; if(k===' '||k==='enter'){e.preventDefault();act(true);} else if(k==='p'){act(false);} else if(k==='h'){showHint();} }
  else { if(k===' '||k==='enter'){e.preventDefault();nextCard();} else if(k==='r'){showAnswer('reveal');} else if(k==='h'){showHint();} }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && G) keepAwake(); });
renderSetup();
})();
</script>

</body>
